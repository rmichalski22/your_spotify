services:
  app:
    container_name: server
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        NODE_ENV: development
    volumes:
      - ./apps/server/src/:/app/apps/server/src/
    links:
      - mongo
    depends_on:
      - mongo
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      LOG_LEVEL: debug
      API_ENDPOINT: ${API_ENDPOINT:-http://127.0.0.1:8080} # Register this URL plus /oauth/spotify/callback in Spotify
      CLIENT_ENDPOINT: ${CLIENT_ENDPOINT:-http://127.0.0.1:3000}
      # OFFLINE_DEV_ID: true

  mongo:
    image: mongo:8
    volumes:
      - ./db_data:/data/db
    ports:
      - "27017:27017"

  web:
    container_name: web
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        NODE_ENV: development
    volumes:
      - ./apps/client/src:/app/apps/client/src/
      - ./apps/client/public:/app/apps/client/public/
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      API_ENDPOINT: ${API_ENDPOINT:-http://127.0.0.1:8080}
